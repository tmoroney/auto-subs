name: Release credential transport
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/manual/test_macos_keychain_transport.py'
permissions:
  contents: read
jobs:
  transport:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic credential transport guards
        run: python3 -m unittest discover -s scripts/tests -p test_release_credentials.py -v
      - name: Native dummy-keychain transport smoke check
        run: python3 tests/manual/test_macos_keychain_transport.py -v
